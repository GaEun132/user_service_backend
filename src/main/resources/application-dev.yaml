spring:

  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

token:
  secret: "${TOKEN_SECRET}"
  expiration-time: "${TOKEN_EXPIRATION_TIME}"

cloud:
  aws:
    s3:
      access-key: "${RUSTFS_ACCESS_KEY:rustfsadmin}"
      secret-key: "${RUSTFS_SECRET_KEY:rustfsadmin}"
      bucket-name: "${RUSTFS_BUCKET:petlog-dev-images}"
      endpoint: "${RUSTFS_ENDPOINT:http://localhost:9002}"
      public-url: "${RUSTFS_PUBLIC_URL:http://localhost:9002}"
      path-style-access-enabled: true
    region: "${RUSTFS_REGION:${AWS_BUCKET_REGION:ap-northeast-2}}"

springdoc:
  api-docs:
    path: "${SWAGGER_DOCS}"
  swagger-ui:
    path: "${SWAGGER_UI}"
